# S10: three cars on the S2 road: free flow, a slow driver who stops briefly, and one who misses the exit.
name: S10 three cars
description: Three cars on the S2 road with different behaviour, to compare estimates side by side.
seed: 10
duration: 420
road:
  main:
    - { type: straight, length: 1500 }
    - { type: clothoid, length: 150, curvatureEnd: 0.002 }
    - { type: arc, length: 800, curvature: 0.002, grade: -0.03 }
    - { type: clothoid, length: 150, curvatureEnd: 0.0, grade: -0.01 }
    - { type: straight, length: 2500, grade: 0.02 }
  tunnels:
    - { from: 1800, to: 4800 }
  branches:
    - at: 3900
      speedLimit: 16.7
      tunnelUntil: 250
      ramp:
        - { type: clothoid, length: 80, curvatureEnd: -0.01, grade: 0.02 }
        - { type: arc, length: 250, curvature: -0.01, grade: 0.04 }
        - { type: clothoid, length: 80, curvatureEnd: 0.0, grade: 0.02 }
        - { type: straight, length: 600 }
route:
  takeBranchAt: [3900]
cars:
  - id: fast
    driver: { speedFactor: 1.1 }
  - id: cautious
    startTime: 15
    driver: { speedFactor: 0.8 }
    events:
      - { at: 3000, type: stop, duration: 20 }
  - id: missed-exit
    startTime: 25
    driver: { pFollowRoute: 0.0 }
